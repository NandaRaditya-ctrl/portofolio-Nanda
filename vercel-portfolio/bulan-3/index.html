<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List | Bulan 3 - JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/shared/projects.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1><i class="fas fa-check-square"></i> To-Do List</h1>
            <p>Selesaikan tugas Anda hari ini!</p>
        </header>

        <!-- Form untuk menambah tugas baru -->
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Apa yang ingin Anda kerjakan hari ini?" autocomplete="off" maxlength="200" required>
            <button type="submit" id="add-btn"><i class="fas fa-plus"></i> Tambah</button>
        </form>

        <!-- Filter / Tabs -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="pending">Belum Selesai</button>
            <button class="filter-btn" data-filter="completed">Selesai</button>
        </div>

        <!-- Daftar List Tugas -->
        <div class="todo-list-container">
            <ul id="todo-list">
                <!-- Data akan dirender oleh JavaScript -->
            </ul>
        </div>

        <div class="stats">
            <span id="items-left">0 tugas tersisa</span>
            <button id="clear-completed">Hapus yang Selesai</button>
        </div>
    </div>

    <script src="script.js"></script>
<script src="/shared/projects.js" defer></script>
</body>
</html>
